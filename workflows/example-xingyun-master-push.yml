# 示例: 星云 ERP master push 完整 CI/CD
# 放到 xingyun 仓库: .github/workflows/master-push.yml
#
# 依赖的可复用 workflow 存在 ycggggoo/.github/.github/workflows/ 下:
#   - docker-build-push.yml
#   - ssh-deploy.yml

name: Master Push - Build & Deploy

on:
  push:
    branches: [master]

jobs:
  # -- 后端构建 & 推送 GHCR --
  backend:
    uses: ycggggoo/.github/.github/workflows/docker-build-push.yml@master
    with:
      image-name: ycggggoo/xingyun-api
      dockerfile: deploy/Dockerfile.api
      context: .
      java-version: '21'
      maven-module: xingyun-api
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # -- 前端构建 & 推送 GHCR --
  frontend:
    uses: ycggggoo/.github/.github/workflows/frontend-node-ci.yml@master
    with:
      image-name: ycggggoo/xingyun-web
      dockerfile: deploy/Dockerfile.web
      context: xingyun-front
      node-version: '20'

  # -- 部署到生产服务器 --
  deploy:
    needs: [backend, frontend]
    uses: ycggggoo/.github/.github/workflows/ssh-deploy.yml@master
    with:
      image-name: ghcr.io/ycggggoo/xingyun-api
      container-name: xingyun-api
      compose-file: docker-compose.app.yml
      deploy-dir: /data/xingyun-erp
      health-url: http://localhost:8080/actuator/health
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
