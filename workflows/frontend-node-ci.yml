# 前端 CI: Docker 构建 & 推送 GHCR
# Dockerfile.web 内部完成 pnpm install + build

name: Frontend Docker CI

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: 'deploy/Dockerfile.web'
      context:
        required: false
        type: string
        default: '.'
    secrets:
      GHCR_PAT:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            -t ghcr.io/${{ inputs.image-name }}:${{ github.sha }} \
            -t ghcr.io/${{ inputs.image-name }}:${{ env.SHORT_SHA }} \
            -t ghcr.io/${{ inputs.image-name }}:latest \
            ${{ inputs.context }}

      - name: Login GHCR & Push
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ inputs.image-name }}:${{ github.sha }}
          docker push ghcr.io/${{ inputs.image-name }}:${{ env.SHORT_SHA }}
          docker push ghcr.io/${{ inputs.image-name }}:latest
