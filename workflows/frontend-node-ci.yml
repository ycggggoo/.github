# 前端 Node CI (pnpm build + Docker)
# 适用于 Vue/React 前端项目

name: Frontend Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      image-name:
        required: true
        type: string
        description: 'ghcr.io 镜像名'
      dockerfile:
        required: false
        type: string
        default: 'deploy/Dockerfile.web'
      context:
        required: false
        type: string
        default: '.'
    secrets:
      GHCR_PAT:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:docker

      - run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            -t ghcr.io/${{ inputs.image-name }}:${{ github.sha }} \
            -t ghcr.io/${{ inputs.image-name }}:${{ env.SHORT_SHA }} \
            -t ghcr.io/${{ inputs.image-name }}:latest \
            ${{ inputs.context }}

      - name: Login GHCR & Push
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ inputs.image-name }}:${{ github.sha }}
          docker push ghcr.io/${{ inputs.image-name }}:${{ env.SHORT_SHA }}
          docker push ghcr.io/${{ inputs.image-name }}:latest
