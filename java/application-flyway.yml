# Flyway 多数据源配置片段
# 复制到 application.yml 或 application-prod.yml

spring:
  flyway:
    enabled: false  # 关闭默认 Flyway，手动配置多数据源

# 单数据源项目只需:
# spring:
#   flyway:
#     enabled: true
#     locations: classpath:db/migration
#     baseline-on-migrate: true
#     baseline-version: 1

# 迁移文件命名: V<版本号>__<描述>.sql (双下划线)
# 已执行的迁移不可修改，必须追加新 V 文件
